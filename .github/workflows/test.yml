name: PowerShell Tests & Quality Check

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test-windows:
    name: Unit Tests (${{ matrix.shell }})
    runs-on: windows-latest
    strategy:
      matrix:
        shell: [ powershell, pwsh ]
    defaults:
      run:
        shell: ${{ matrix.shell }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Pester 5
        run: |
          Set-PSRepository -Name 'PSGallery' -InstallationPolicy Trusted
          Install-Module -Name Pester -MinimumVersion 5.3.0 -Scope CurrentUser -Force -SkipPublisherCheck

      - name: Run Pester Tests
        run: |
          $config = New-PesterConfiguration
          $config.Run.Path = "Tests/PrinterManagement.Tests.ps1"
          $config.Output.Verbosity = "Detailed"
          $config.Run.PassThru = $true
          $res = Invoke-Pester -Configuration $config
          if ($res.FailedCount -gt 0) {
            throw "$($res.FailedCount) test(s) failed."
          }

